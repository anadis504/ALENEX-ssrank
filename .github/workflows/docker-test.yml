name: Docker test

on:
  push:
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Docker image
        run: docker build --no-cache -t sbwt-test .

      - name: Inspect Docker image
        run: |
          docker image inspect sbwt-test \
            --format='Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}'

      - name: Check executable
        run: docker run --rm sbwt-test --help

      - name: Build example SBWT index
        run: |
          mkdir -p test-output

          docker run --rm \
            -v "$PWD/test-output:/output" \
            sbwt-test \
            build \
            -i /SBWT/example_data/coli3.fna \
            -o /output/index.sbwt \
            -k 30

      - name: Verify index was created
        run: test -s test-output/index.sbwt
